# Installer Configuration
# This file contains default settings for the SSH installation scripts

[General]
# Default email domain (leave empty for manual entry)
default_email_domain=

# Default key comment
default_comment=Generated by Ionity SSH Installer

# Auto-backup keys (true/false)
auto_backup=false

# Default backup path (leave empty for interactive selection)
default_backup_path=

[SSH Keys]
# Default number of keys to generate
default_key_count=1

# Default key type (rsa, ed25519, ecdsa)
default_key_type=ed25519

# Default key bits for RSA (2048, 4096, 8192)
default_rsa_bits=4096

# Default key bits for ECDSA (256, 384, 521)
default_ecdsa_bits=256

[GPG Keys]
# Auto-generate GPG keys (true/false)
auto_generate_gpg=false

# Default GPG key type (rsa, dsa, elg)
gpg_key_type=rsa

# Default GPG key length (2048, 4096)
gpg_key_length=4096

# GPG key expiration (0 for no expiration, or days)
gpg_expiration=0

[Paths]
# SSH directory (relative to user home)
ssh_directory=.ssh

# GPG directory (relative to user home)
gpg_directory=.gnupg

[Windows]
# Auto-install OpenSSH if not present (true/false)
auto_install_openssh=true

# Auto-elevate to administrator (true/false)
auto_elevate=true

# Open SSH directory after completion (true/false)
open_ssh_directory=false

[Linux]
# Check for package updates before installation (true/false)
check_updates=false

# Auto-install missing packages (true/false)
auto_install_packages=false

# Use colors in terminal output (true/false)
use_colors=true

[Security]
# Use passphrase for private keys (true/false)
# Note: Current scripts generate keys without passphrase for automation
# Set to true if you want to be prompted for passphrases
use_passphrase=false

# Set strict file permissions (true/false)
strict_permissions=true

# Backup private keys (true/false)
# Warning: Only backup to secure, encrypted locations
backup_private_keys=true

[Advanced]
# SSH config file auto-generation (true/false)
auto_create_config=false

# Add keys to SSH agent automatically (true/false)
auto_add_to_agent=false

# Generate host-specific keys (true/false)
# If true, prompts for hostname to include in key name
host_specific_keys=false

# Generate multiple key types at once (true/false)
generate_all_types=false

# Key naming format (sequential, timestamp, custom)
key_naming=sequential

[Logging]
# Enable logging (true/false)
enable_logging=false

# Log file location (relative to home directory)
log_file=.ssh/installer.log

# Log level (error, warning, info, debug)
log_level=info
